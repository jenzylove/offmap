services:
  offmap-agent:
    image: ghcr.io/jenzylove/offmap-agent@sha256:05afd71b3f6b19f142dec7b9af84eb78f420636a3b7551cad0c44d145803f214
    platform: linux/amd64
    restart: always
    ports:
      - "8787:8787"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - offmap-data:/app/apps/agent/data
    environment:
      NEAR_NETWORK: mainnet
      OFFMAP_CONTRACT: offmapfi.near
      MPC_CONTRACT: v1.signer
      NEAR_RPC: https://rpc.mainnet.fastnear.com
      BASE_RPC: https://mainnet.base.org
      BATCH_SECONDS: "90"
      ONECLICK_JWT: ${ONECLICK_JWT}
volumes:
  offmap-data:
